<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول المسؤول</title><style>body{font-family:system-ui;background:#0b1220;color:#e8eef6;padding:25px}.box{max-width:430px;margin:10vh auto;background:#121d2d;padding:24px;border:1px solid #26364a;border-radius:14px}input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px}input{background:#0b1524;color:white;border:1px solid #26364a}button{background:#176c5a;color:white;border:0}a{color:#7eb6ff}</style><div class="box"><h2>دخول المسؤول</h2>{% for m in get_flashed_messages() %}<p>{{m}}</p>{% endfor %}<form method="post"><label>كلمة مرور المسؤول</label><input type="password" name="password" required><button>دخول</button></form><a href="/">العودة للرادار</a></div></html>
